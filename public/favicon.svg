<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LegalConnects">
  <!-- Favicon-first redraw of the header logo. Same scales-and-tile identity,
       but strokes are ~2.4x heavier relative to the canvas and the base dot is
       replaced by a foot, because both vanish at 16px. -->
  <defs>
    <linearGradient id="lc" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5A89F7" />
      <stop offset="1" stop-color="#1E6DEB" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#lc)" />

  <g stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- beam and central post -->
    <path d="M20 19h24" />
    <path d="M32 15v31" />
    <!-- foot: reads as a base at small sizes where a dot would disappear -->
    <path d="M24 46h16" />
    <!-- pans -->
    <path d="M20 19 13.5 32a6.5 6.5 0 0 0 13 0Z" />
    <path d="M44 19 37.5 32a6.5 6.5 0 0 0 13 0Z" />
  </g>
</svg>
